<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONIC HYBRID // CHARTS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
    --bg: #050505;
    --surface: #101010;
    --surface2: #1a1a1a;
    --border: #ff4500;
    --blue: #0066ff;
    --white: #ffffff;
    --gray: #888888;
    --mono:'JetBrains Mono',monospace;
    --sans:'Inter',sans-serif
}
body{font-family:var(--sans);background:var(--bg);color:var(--white);background-image:linear-gradient(rgba(255,69,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,69,0,0.03) 1px, transparent 1px);background-size:40px 40px}
nav{position:fixed;top:0;left:0;right:0;padding:1.5rem 2rem;background:#000;border-bottom:3px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:100}
.logo{font-family:var(--mono);font-size:1.8rem;font-weight:900;color:var(--white);text-transform:uppercase;letter-spacing:1px}
.logo span{color:var(--border)}

.hero{min-height:95vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding-top:100px}

.turntable{width:280px;height:280px;border-radius:50%;background:#000;border:12px solid var(--surface2);margin-bottom:2rem;position:relative;display:flex;align-items:center;justify-content:center;animation:spin 10s linear infinite;box-shadow:0 0 20px rgba(0,102,255,0.2)}
.turntable::after{content:'';position:absolute;width:40px;height:40px;background:#000;border-radius:50%;border:4px solid var(--border)}
.turntable img{width:65%;height:65%;border-radius:50%;object-fit:cover}
@keyframes spin{100%{transform:rotate(360deg)}}

.like-btn{background:var(--blue);color:white;padding:1rem 2.5rem;border:none;font-weight:900;text-transform:uppercase;cursor:pointer;margin-top:1.5rem;font-size:1.1rem;transition:0.3s}
.like-btn:hover{background:var(--border)}

.demo-section{width:100%;max-width:500px;margin:2rem auto;padding:2rem;background:var(--surface);border:2px solid var(--blue)}
.demo-input{width:100%;background:black;border:2px solid var(--surface2);padding:1rem;color:white;margin-bottom:1rem;font-family:var(--mono)}
.collapse-btn{background:var(--surface2);border:2px solid var(--blue);color:white;padding:1rem;width:100%;text-align:left;margin-top:0.5rem;font-weight:bold;cursor:pointer}
.collapse-content{display:none;padding:1rem;background:var(--surface);border:1px solid var(--blue);margin-top:0.5rem;color:var(--gray);font-size:0.9rem}
</style>
</head>
<body>

<nav>
    <div class="logo">SONIC<span>HYBRID</span></div>
    <div style="color:var(--border);font-family:var(--mono)">LIVE // SYSTEM</div>
</nav>

<section class="hero">
    <div class="turntable">
        <img src="https://via.placeholder.com/200" id="album-art" alt="Cover">
    </div>
    <h2 id="song-title" style="font-size:2rem;text-transform:uppercase">Songtitel</h2>
    <p id="artist-name" style="color:var(--blue);font-weight:bold;font-size:1.2rem;margin-bottom:1rem">Künstlername</p>
    <button class="like-btn" onclick="alert('Support registriert!')">👍 Support diesen Song</button>
</section>

<section class="demo-section">
    <h3 style="margin-bottom:1rem;text-transform:uppercase;color:var(--border)">Song vorschlagen</h3>
    <input type="text" class="demo-input" placeholder="Künstler">
    <input type="text" class="demo-input" placeholder="Titel">
    <button style="background:var(--border);color:white;border:none;padding:1rem;width:100%;font-weight:900;cursor:pointer">EINREICHEN</button>
</section>

<section style="max-width:500px;margin:0 auto 4rem auto;padding:0 2rem">
    <button class="collapse-btn" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display==='block'?'none':'block')">IMPRESSUM</button>
    <div class="collapse-content">SONIC HYBRID // Projektleitung. Kontakt: radio-projekt@protonmail.com</div>
    <button class="collapse-btn" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display==='block'?'none':'block')">DATENSCHUTZ</button>
    <div class="collapse-content">Keine Datenspeicherung. Nutzung via Spotify-API.</div>
</section>

</body>
</html>
